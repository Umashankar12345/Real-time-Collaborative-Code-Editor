name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    services:
      mongodb:
        image: mongo
        ports:
          - 27017:27017
      redis:
        image: redis
        ports:
          - 6379:6379

    steps:
    - uses: actions/checkout@v3
    
    - name: Install Backend Dependencies
      run: |
        cd backend
        npm install
        
    - name: Run API Tests
      run: |
        cd backend
        npx jest ../tests/api/
      
    - name: Install Frontend Dependencies
      run: |
        cd frontend
        npm ci
        
    - name: Install Playwright Browsers
      run: |
        npm install @playwright/test
        npx playwright install --with-deps
      
    - name: Run E2E Tests
      run: npx playwright test tests/e2e/
      
    - name: Build Frontend
      run: |
        cd frontend
        npm run build
